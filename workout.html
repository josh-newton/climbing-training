<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Workout Session | Climbing Training</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg-color: #0a0b1e;
                --card-bg: rgba(16, 18, 45, 0.8);
                --primary-accent: #ffcc00;
                --secondary-accent: #ff8800;
                --text-main: #e0e0ff;
                --text-dim: #a0a0c0;
                --glow: 0 0 15px rgba(255, 204, 0, 0.3);
                --work-color: rgba(0, 255, 127, 0.7);
                --rest-color: rgba(0, 255, 255, 0.8);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-main);
                font-family: "Rajdhani", sans-serif;
                min-height: 100vh;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* --- Screens --- */
            .screen {
                display: none;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 2rem;
                text-align: center;
            }

            .screen.active {
                display: flex;
            }

            /* --- Setup Screen --- */
            #setup-screen {
                overflow-y: auto;
                background-image:
                    radial-gradient(circle at 20% 30%, rgba(255, 136, 0, 0.05) 0%, transparent 40%),
                    radial-gradient(circle at 80% 70%, rgba(255, 204, 0, 0.05) 0%, transparent 40%);
            }

            .setup-container {
                width: 100%;
                max-width: 500px;
                background: var(--card-bg);
                border: 2px solid var(--primary-accent);
                border-radius: 30px;
                padding: 2rem;
                backdrop-filter: blur(10px);
                box-shadow: var(--glow);
            }

            h1 {
                font-family: "Orbitron", sans-serif;
                font-size: 2rem;
                color: var(--primary-accent);
                margin-bottom: 1.5rem;
                text-transform: uppercase;
                letter-spacing: 2px;
            }

            .input-group {
                margin-bottom: 1.2rem;
                text-align: left;
            }

            label {
                display: block;
                color: var(--text-dim);
                font-size: 0.8rem;
                text-transform: uppercase;
                margin-bottom: 0.4rem;
                letter-spacing: 1px;
            }

            input {
                width: 100%;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 204, 0, 0.3);
                border-radius: 8px;
                padding: 0.8rem;
                color: var(--text-main);
                font-family: "Rajdhani", sans-serif;
                font-size: 1rem;
                outline: none;
            }

            input:focus { border-color: var(--primary-accent); }

            .button-row {
                display: flex;
                gap: 1rem;
                margin-top: 1.5rem;
            }

            button {
                flex: 1;
                background: transparent;
                border: 2px solid var(--primary-accent);
                color: var(--primary-accent);
                padding: 0.8rem;
                border-radius: 12px;
                font-family: "Orbitron", sans-serif;
                font-size: 0.9rem;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            button:hover {
                background: var(--primary-accent);
                color: var(--bg-color);
                box-shadow: 0 0 15px var(--primary-accent);
            }

            .saved-workouts {
                margin-top: 2rem;
                max-height: 200px;
                overflow-y: auto;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding-top: 1rem;
            }

            .workout-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgba(255, 255, 255, 0.05);
                padding: 0.6rem 1rem;
                border-radius: 8px;
                margin-bottom: 0.5rem;
                cursor: pointer;
                transition: background 0.2s;
            }

            .workout-item:hover { background: rgba(255, 255, 255, 0.1); }
            .delete-btn {
                color: #ff4444;
                border: none;
                background: none;
                font-size: 1.2rem;
                padding: 0 0.5rem;
                cursor: pointer;
            }

            /* --- Active Workout & Countdown --- */
            #countdown-screen, #active-screen, #finish-screen {
                background-color: transparent;
            }

            .big-number {
                font-family: "Orbitron", sans-serif;
                font-size: 15rem;
                color: var(--primary-accent);
                text-shadow: 0 0 30px var(--primary-accent);
                z-index: 10;
            }

            .status-label {
                font-family: "Orbitron", sans-serif;
                font-size: 2rem;
                text-transform: uppercase;
                letter-spacing: 5px;
                margin-bottom: 1rem;
                z-index: 10;
            }

            .set-counter {
                position: absolute;
                top: 10%;
                font-size: 2rem;
                font-family: "Orbitron", sans-serif;
                color: var(--text-main);
                text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                z-index: 10;
            }

            .progress-bg {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 0%;
                z-index: 1;
                transition: width 0.05s linear;
                box-shadow: 15px 0 40px rgba(0, 255, 127, 0.6);
            }

            /* Rest state shadow */
            #active-screen[data-state="rest"] .progress-bg {
                box-shadow: 15px 0 40px rgba(0, 255, 255, 0.5);
            }

            /* --- Controls --- */
            .close-btn {
                position: absolute;
                top: 2rem;
                left: 2rem;
                font-size: 3rem;
                color: var(--text-main);
                text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                cursor: pointer;
                line-height: 1;
                z-index: 100;
                transition: color 0.3s;
            }
            .close-btn:hover { color: var(--primary-accent); }

            .nav-home {
                margin-top: 2rem;
                color: var(--text-dim);
                text-decoration: none;
                text-transform: uppercase;
                font-size: 0.8rem;
            }

            /* --- Landscape Adjustments --- */
            @media (orientation: landscape) and (max-height: 500px) {
                .setup-container { padding: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
                .setup-container h1 { grid-column: span 2; margin-bottom: 0.5rem; font-size: 1.5rem; }
                .saved-workouts { grid-column: span 2; }
                .big-number { font-size: 10rem; }
            }
        </style>
    </head>
    <body>

        <!-- Close Cross (Global for Workout) -->
        <div id="global-close" class="close-btn" style="display: none;">&times;</div>

        <!-- 1. SETUP SCREEN -->
        <div id="setup-screen" class="screen active">
            <div class="setup-container">
                <h1>Initialize Session</h1>
                <div class="input-group">
                    <label>Workout Name</label>
                    <input type="text" id="w-name" placeholder="e.g. Max Hangs">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="input-group" style="flex: 1;">
                        <label>Sets</label>
                        <input type="number" id="w-sets" value="6" min="1">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Work (s)</label>
                        <input type="number" id="w-work" value="10" min="1">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Rest (s)</label>
                        <input type="number" id="w-rest" value="60" min="0">
                    </div>
                </div>
                <div class="button-row">
                    <button id="start-btn">Start Workout</button>
                    <button id="save-btn" style="border-color: var(--secondary-accent); color: var(--secondary-accent);">Save Config</button>
                </div>
                <div class="saved-workouts" id="saved-list">
                    <!-- Saved items here -->
                </div>
                <a href="index.html" class="nav-home">← Dashboard</a>
            </div>
        </div>

        <!-- 2. COUNTDOWN SCREEN -->
        <div id="countdown-screen" class="screen">
            <div class="big-number" id="cd-timer">3</div>
        </div>

        <!-- 3. ACTIVE SCREEN -->
        <div id="active-screen" class="screen">
            <div class="progress-bg" id="progress-bar"></div>
            <div class="set-counter" id="active-set">SET 1 / 6</div>
            <div class="status-label" id="active-status">WORK</div>
            <div class="big-number" id="active-timer">10</div>
        </div>

        <!-- 4. FINISH SCREEN -->
        <div id="finish-screen" class="screen">
            <div class="status-label">SESSION COMPLETE</div>
            <div class="big-number" id="elapsed-timer">0</div>
            <p style="color: var(--text-dim); letter-spacing: 2px;">SECONDS SINCE FINISH</p>
            <button id="done-btn" style="margin-top: 3rem; width: 180px;">Back to Menu</button>
        </div>

        <!-- 5. EXIT MODAL -->
        <div id="exit-modal" class="screen" style="z-index: 1000; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);">
            <div class="setup-container" style="max-width: 400px; border-color: var(--secondary-accent);">
                <h2 style="font-family: 'Orbitron', sans-serif; color: var(--secondary-accent); margin-bottom: 1.5rem;">ABORT SESSION?</h2>
                <p style="color: var(--text-main); margin-bottom: 2rem; letter-spacing: 1px;">Current progress will be lost.</p>
                <div class="button-row">
                    <button id="confirm-exit" style="border-color: #ff4444; color: #ff4444;">YES, ABORT</button>
                    <button id="cancel-exit">RESUME</button>
                </div>
            </div>
        </div>

        <script>
            // --- Audio Logic ---
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playBleep(freq = 440, duration = 0.1) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }

            function speak(text) {
                const msg = new SpeechSynthesisUtterance(text);
                msg.rate = 1.1;
                window.speechSynthesis.speak(msg);
            }

            // --- State & DOM ---
            let workout = { sets: 6, work: 10, rest: 60, currentSet: 1, state: 'work' };
            let timer = null;
            let secondsLeft = 0;
            let elapsedSeconds = 0;

            const screens = {
                setup: document.getElementById('setup-screen'),
                countdown: document.getElementById('countdown-screen'),
                active: document.getElementById('active-screen'),
                finish: document.getElementById('finish-screen')
            };

            function showScreen(name) {
                Object.values(screens).forEach(s => s.classList.remove('active'));
                screens[name].classList.add('active');
                document.getElementById('global-close').style.display = (name === 'setup') ? 'none' : 'block';
            }

            // --- Workout Management ---
            function saveWorkout() {
                const name = document.getElementById('w-name').value || 'Unnamed Workout';
                const config = {
                    name,
                    sets: parseInt(document.getElementById('w-sets').value),
                    work: parseInt(document.getElementById('w-work').value),
                    rest: parseInt(document.getElementById('w-rest').value)
                };
                let saved = JSON.parse(localStorage.getItem('workouts') || '[]');
                saved.push(config);
                localStorage.setItem('workouts', JSON.stringify(saved));
                renderSaved();
            }

            function renderSaved() {
                const list = document.getElementById('saved-list');
                const saved = JSON.parse(localStorage.getItem('workouts') || '[]');
                list.innerHTML = '';
                saved.forEach((w, index) => {
                    const div = document.createElement('div');
                    div.className = 'workout-item';
                    div.innerHTML = `
                        <div style="flex:1" onclick="loadAndStart(${index})">
                            <strong>${w.name}</strong><br>
                            <small>${w.sets} sets | ${w.work}s | ${w.rest}s</small>
                        </div>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteWorkout(${index})" title="Delete Workout">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    `;
                    list.appendChild(div);
                });
            }

            function deleteWorkout(index) {
                let saved = JSON.parse(localStorage.getItem('workouts') || '[]');
                saved.splice(index, 1);
                localStorage.setItem('workouts', JSON.stringify(saved));
                renderSaved();
            }

            function loadAndStart(index) {
                const saved = JSON.parse(localStorage.getItem('workouts') || '[]');
                const w = saved[index];
                document.getElementById('w-name').value = w.name;
                document.getElementById('w-sets').value = w.sets;
                document.getElementById('w-work').value = w.work;
                document.getElementById('w-rest').value = w.rest;
                startWorkout();
            }

            // --- Execution Logic ---
            function startWorkout() {
                workout.sets = parseInt(document.getElementById('w-sets').value);
                workout.work = parseInt(document.getElementById('w-work').value);
                workout.rest = parseInt(document.getElementById('w-rest').value);
                workout.currentSet = 1;
                workout.state = 'work';
                
                showScreen('countdown');
                let count = 3;
                document.getElementById('cd-timer').textContent = count;
                playBleep(440);
                
                const cdInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        document.getElementById('cd-timer').textContent = count;
                        playBleep(440);
                    } else {
                        clearInterval(cdInterval);
                        speak("Go");
                        beginCycle();
                    }
                }, 1000);
            }

            function beginCycle() {
                showScreen('active');
                runTimer();
            }

            function runTimer(resumingMs = null) {
                const totalTime = (workout.state === 'work') ? workout.work : workout.rest;
                const startTime = Date.now();
                const durationMs = resumingMs !== null ? resumingMs : totalTime * 1000;
                const endTime = startTime + durationMs;
                
                const display = document.getElementById('active-timer');
                const status = document.getElementById('active-status');
                const setLabel = document.getElementById('active-set');
                const progress = document.getElementById('progress-bar');
                const screen = document.getElementById('active-screen');

                screen.setAttribute('data-state', workout.state);
                status.textContent = workout.state.toUpperCase();
                status.style.color = 'var(--primary-accent)';
                progress.style.backgroundColor = (workout.state === 'work') ? 'var(--work-color)' : 'var(--rest-color)';
                setLabel.textContent = `SET ${workout.currentSet} / ${workout.sets}`;

                if (timer) clearInterval(timer);
                
                timer = setInterval(() => {
                    const now = Date.now();
                    const remainingMs = Math.max(0, endTime - now);
                    secondsLeft = remainingMs; // Store globally for pausing
                    const remainingSec = Math.ceil(remainingMs / 1000);
                    
                    display.textContent = remainingSec;
                    
                    // Smooth Progress Background
                    const percent = ((totalTime * 1000 - remainingMs) / (totalTime * 1000)) * 100;
                    progress.style.width = percent + '%';

                    if (remainingMs <= 0) {
                        clearInterval(timer);
                        handleTransition();
                    }
                }, 50);
            }

            function handleTransition() {
                if (workout.state === 'work') {
                    playBleep(660, 0.3);
                    if (workout.currentSet < workout.sets && workout.rest > 0) {
                        workout.state = 'rest';
                        runTimer();
                    } else {
                        nextSet();
                    }
                } else {
                    playBleep(880, 0.1);
                    nextSet();
                }
            }

            function nextSet() {
                workout.currentSet++;
                if (workout.currentSet > workout.sets) {
                    finishWorkout();
                } else {
                    workout.state = 'work';
                    speak("Go");
                    runTimer();
                }
            }

            function finishWorkout() {
                playBleep(440, 0.1);
                setTimeout(() => playBleep(554, 0.1), 100);
                setTimeout(() => playBleep(659, 0.3), 200);
                
                showScreen('finish');
                elapsedSeconds = 0;
                document.getElementById('elapsed-timer').textContent = elapsedSeconds;
                
                timer = setInterval(() => {
                    elapsedSeconds++;
                    document.getElementById('elapsed-timer').textContent = elapsedSeconds;
                }, 1000);
            }

            // --- UI Events ---
            const exitModal = document.getElementById('exit-modal');

            document.getElementById('start-btn').onclick = () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                startWorkout();
            };
            document.getElementById('save-btn').onclick = saveWorkout;
            document.getElementById('done-btn').onclick = () => {
                clearInterval(timer);
                showScreen('setup');
            };

            document.getElementById('global-close').onclick = () => {
                clearInterval(timer);
                exitModal.classList.add('active');
            };

            document.getElementById('confirm-exit').onclick = () => {
                exitModal.classList.remove('active');
                showScreen('setup');
            };

            document.getElementById('cancel-exit').onclick = () => {
                exitModal.classList.remove('active');
                runTimer(secondsLeft); // Resume with the stored remaining MS
            };

            window.onload = () => {
                renderSaved();
                
                // Handle URL parameters
                const params = new URLSearchParams(window.location.search);
                if (params.has('sets') || params.has('work') || params.has('rest')) {
                    if (params.has('name')) document.getElementById('w-name').value = params.get('name');
                    if (params.has('sets')) document.getElementById('w-sets').value = params.get('sets');
                    if (params.has('work')) document.getElementById('w-work').value = params.get('work');
                    if (params.has('rest')) document.getElementById('w-rest').value = params.get('rest');
                }
            };
        </script>
    </body>
</html>
